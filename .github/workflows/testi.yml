name: testi

on: [push, pull_request]

jobs:
  testi:
    runs-on: ubuntu-latest
    steps:
      - name: prevzem kode
        uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: odvisnosti
        run: pip install -r requirements.txt
      - name: testi
        run: python -m unittest discover -s testi -t . -v
